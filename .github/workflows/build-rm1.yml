name: Build Riddle for reMarkable 1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "README*.md"

jobs:
  build-rm1:
    runs-on: ubuntu-latest
    container:
      # v4.0 = glibc 2.35 / Linux headers 6.1.55, matching reMarkable OS
      # >= 3.18.2.3 (covers the 3.27.x target in README-RM1.md).
      image: ghcr.io/toltec-dev/rust:v4.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rust toolchain PATH
        run: |
          set -x
          echo "PATH before: $PATH"
          echo "--- looking for rustup/cargo state ---"
          for d in /root/.rustup /root/.cargo /usr/local/rustup /usr/local/cargo /opt/rustup /opt/cargo; do
            [ -e "$d" ] && echo "exists: $d" && ls -la "$d" 2>/dev/null | head -5
          done
          echo "--- searching filesystem for a real toolchain bin dir ---"
          TOOLCHAIN_BIN=$(find / -xdev -maxdepth 8 -type d -path "*/toolchains/*/bin" 2>/dev/null | head -n1)
          echo "Found: ${TOOLCHAIN_BIN:-none}"
          if [ -n "$TOOLCHAIN_BIN" ]; then
            echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          fi
          echo "--- searching for cargo home bin dir ---"
          CARGO_BIN=$(find / -xdev -maxdepth 6 -type d -path "*/.cargo/bin" -o -path "*cargo/bin" 2>/dev/null | head -n1)
          echo "Found cargo bin: ${CARGO_BIN:-none}"
          if [ -n "$CARGO_BIN" ]; then
            echo "$CARGO_BIN" >> "$GITHUB_PATH"
          fi
          if command -v rustup >/dev/null 2>&1; then
            echo "--- rustup toolchain list ---"
            rustup toolchain list || true
            rustup default nightly 2>&1 || rustup default stable 2>&1 || true
          fi

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          arm-remarkable-linux-gnueabihf-gcc --version || arm-linux-gnueabihf-gcc --version || true

      - name: Build (armv7-unknown-linux-gnueabihf, release)
        run: ./build-rm1.sh

      - name: Verify binary architecture
        run: file dist/rm1/riddle

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: riddle-rm1
          path: |
            dist/rm1/riddle
            dist/rm1/riddle-rm1.sh
            dist/rm1/oracle.env.example
          if-no-files-found: error
